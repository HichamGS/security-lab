version: '3.8'

services:
  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - php-fpm
    networks:
      - lab-network

  php-fpm:
    build: ./php-fpm
    volumes:
      - ./app:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - lab-network

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: security_lab
      MYSQL_USER: labuser
      MYSQL_PASSWORD: labpassword
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - lab-network

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - lab-network

  adminer:
    image: adminer:latest
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge

volumes:
  mysql-data:
